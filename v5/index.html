<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubin SonicBrands — v5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-2: #10101a;
      --card: #161623;
      --border: rgba(255, 255, 255, .08);
      --border-2: rgba(255, 255, 255, .16);
      --text: #f5f5fa;
      --muted: #9b9bb0;
      --accent: #1DB954;
      --r-md: 14px;
      --r-lg: 22px;
      --shadow-glow: 0 0 30px rgba(29, 185, 84, .18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
    }

    body {
      font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }

    .app {
      width: 100%;
      max-width: 560px;
    }

    .screen-card {
      background: linear-gradient(180deg, var(--card), var(--bg-2));
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 32px 28px;
      box-shadow: var(--shadow-glow);
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      margin: 0 0 6px;
      text-align: center;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 22px;
    }

    .input-wrap {
      margin-bottom: 14px;
    }

    .input-label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-text,
    .input-textarea {
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--border-2);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
      resize: vertical;
    }

    .input-textarea {
      min-height: 180px;
      font-size: 16px;
      border-width: 2px;
      border-color: var(--accent);
    }

    .input-text:focus,
    .input-textarea:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: box-shadow .2s, transform .05s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #16a34a);
      color: #fff;
      box-shadow: 0 4px 20px rgba(29, 185, 84, .35);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 24px rgba(29, 185, 84, .5);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .btn-primary:disabled {
      opacity: .55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-block {
      width: 100%;
      margin-top: 6px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 14px;
      text-align: center;
    }

    .preview-loading,
    .preview-empty {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 32px 8px;
    }

    .preview-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .preview-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 18px 0 22px;
    }

    .preview-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-2);
      border: 1px solid var(--border-2);
      border-radius: 14px;
      padding: 10px 12px;
      transition: border-color .2s;
    }

    .preview-card:has(.preview-checkbox:checked) {
      border-color: var(--accent);
    }

    .preview-card-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .preview-embed {
      flex: 1 1 auto;
      min-width: 0;
    }

    .preview-info {
      padding: 8px 10px;
      background: rgba(255, 255, 255, .03);
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.55;
      color: var(--muted);
    }

    .preview-info-title {
      color: var(--text);
      font-weight: 700;
      margin-bottom: 4px;
      direction: ltr;
      text-align: start;
    }

    .preview-info-genres {
      direction: ltr;
      text-align: start;
      margin-bottom: 4px;
    }

    .preview-info-label {
      color: var(--muted);
      font-weight: 600;
    }

    .preview-info-sep {
      color: var(--border-2);
      margin: 0 4px;
    }

    .preview-info-desc {
      color: var(--text);
      opacity: .85;
    }

    .preview-embed iframe {
      display: block;
      border-radius: 12px;
    }

    .preview-check-wrap {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      cursor: pointer;
    }

    .preview-checkbox {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .atmo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 18px 0 22px;
    }

    @media (max-width: 480px) {
      .atmo-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .atmo-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-2);
      border: 1px solid var(--border-2);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      user-select: none;
    }

    .atmo-chip:has(.atmo-checkbox:checked) {
      border-color: var(--accent);
      background: rgba(29, 185, 84, .08);
    }

    .atmo-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .atmo-name {
      font-size: 14px;
      color: var(--text);
    }

    .sb-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: sb-spin .7s linear infinite;
      vertical-align: middle;
    }

    @keyframes sb-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .btn-secondary {
      background: var(--bg-2);
      color: var(--text);
      border: 1px solid var(--border-2);
    }

    .btn-secondary:hover {
      background: var(--card);
    }

    .pl-accordion {
      border: 1px solid var(--border-2);
      border-radius: var(--r-md);
      overflow: hidden;
      margin-top: 18px;
    }

    .pl-accordion-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      background: var(--bg-2);
      user-select: none;
    }

    .pl-accordion-info {
      flex: 1;
      min-width: 0;
    }

    .pl-accordion-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pl-accordion-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .pl-accordion-actions {
      padding: 12px 18px 14px;
      background: var(--bg-2);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pl-accordion-actions .btn {
      flex: 1 1 auto;
      padding: 12px 18px;
    }

    /* ===== landing brand header (UI only) ===== */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand-eq {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 30px;
    }

    .brand-eq span {
      width: 5px;
      border-radius: 3px;
      background: var(--accent);
      transform-origin: bottom;
      animation: brand-bounce 1s ease-in-out infinite;
    }

    .brand-eq span:nth-child(1) {
      height: 42%;
      animation-delay: 0s;
    }

    .brand-eq span:nth-child(2) {
      height: 80%;
      animation-delay: .2s;
    }

    .brand-eq span:nth-child(3) {
      height: 55%;
      animation-delay: .4s;
    }

    .brand-eq span:nth-child(4) {
      height: 96%;
      animation-delay: .1s;
    }

    .brand-eq span:nth-child(5) {
      height: 66%;
      animation-delay: .3s;
    }

    @keyframes brand-bounce {

      0%,
      100% {
        transform: scaleY(.35);
      }

      50% {
        transform: scaleY(1);
      }
    }

    .subtitle {
      text-align: center;
    }

    /* ===== responsive: small screens (UI only) ===== */
    @media (max-width: 480px) {
      body {
        padding: 18px 12px;
      }

      .screen-card {
        padding: 24px 18px;
        border-radius: var(--r-md);
      }

      h1 {
        font-size: 22px;
      }

      .input-textarea {
        min-height: 150px;
      }

      /* On narrow screens the Spotify embed needs the whole card width or
         its play button gets clipped. Move the checkbox to an absolute
         overlay so the embed takes full row width. Placed on the LEFT of
         the card (inline-end in RTL) so it covers album art, not the
         iframe's right-edge play button. */
      .preview-card {
        position: relative;
      }

      .preview-card-row {
        gap: 0;
      }

      .preview-check-wrap {
        position: absolute;
        top: 10px;
        inset-inline-end: 10px;
        width: 36px;
        height: 36px;
        background: rgba(10, 10, 15, .85);
        border: 1px solid var(--border-2);
        border-radius: 8px;
        z-index: 2;
        padding: 0;
      }

      .preview-check-wrap .preview-checkbox {
        width: 20px;
        height: 20px;
      }
    }

    /* ===== accessibility: keyboard focus + reduced motion (UI only) ===== */
    .input-text:focus-visible,
    .input-textarea:focus-visible,
    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .brand-eq span {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="screen-card">
      <div class="brand">
        <div class="brand-eq" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <h1>SonicBrands</h1>
      </div>
      <p class="subtitle">פלייליסטים מותאמים לאישיות העסק שלכם, תוך דקה</p>

      <div class="input-wrap">
        <label class="input-label" for="bizName">שם העסק</label>
        <input type="text" class="input-text" id="bizName" placeholder="לדוגמה: בר הכפר, קפה לואיז, מסעדת נוני..."
          maxlength="80" autocomplete="off">
      </div>

      <div class="input-wrap">
        <label class="input-label" for="bizDesc">ספרו לנו על העסק</label>
        <textarea class="input-textarea" id="bizDesc"
          placeholder="לדוגמה: בר יין שכונתי בלב תל אביב, עם קהל בוגר של בני 30+ שיושב בשולחנות בחצר, שותה ומשוחח באווירה אינטימית"
          maxlength="1000"></textarea>
      </div>

      <button class="btn btn-primary btn-block" id="submitBtn">המשך ←</button>
    </div>
  </div>

  <script type="module" src="/v5/app.js?v=16082026a"></script>
</body>

</html>
