<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בחירת אווירה — טסט</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a1117;
      --bg-2: #0f1c26;
      --card: #142835;
      --card-2: #17303f;
      --border: rgba(255, 255, 255, .07);
      --border-2: rgba(255, 255, 255, .14);
      --text: #f5f7f8;
      --muted: #93a5af;
      --accent: #f0a73f;
      --accent-2: #d98a1f;
      --teal: #2c637a;
      --teal-soft: #57a3bd;
      --ease: cubic-bezier(.22, .8, .32, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
    }

    body {
      font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 26px 16px 60px;
      background:
        radial-gradient(1000px 560px at 85% -12%, rgba(44, 99, 122, .38), transparent 62%),
        radial-gradient(760px 460px at 4% 108%, rgba(240, 167, 63, .10), transparent 55%),
        var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .app {
      width: 100%;
      max-width: 580px;
    }

    .screen-card {
      position: relative;
      background: linear-gradient(180deg, var(--card), var(--bg-2));
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 34px 30px 30px;
      box-shadow: 0 0 40px rgba(240, 167, 63, .10), 0 24px 60px rgba(0, 0, 0, .35);
      overflow: hidden;
    }

    h1 {
      font-size: 27px;
      font-weight: 900;
      margin: 0 0 6px;
      text-align: center;
      letter-spacing: .2px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14.5px;
      margin: 0 0 22px;
      text-align: center;
      line-height: 1.6;
    }

    /* ---------- test harness controls ---------- */
    .controls {
      width: 100%;
      max-width: 580px;
      background: var(--bg-2);
      border: 1px solid var(--border-2);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }
    .controls .grow { flex: 1; }
    .controls button, .controls select, .controls label {
      font-family: inherit;
      font-size: 13px;
    }
    .controls button {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border-2);
      border-radius: 10px;
      padding: 7px 12px;
      cursor: pointer;
      font-weight: 700;
    }
    .controls button:hover { border-color: var(--accent); color: var(--accent); }
    .controls button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #1b1508;
      border: none;
    }
    .controls .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .controls .toggle input { accent-color: var(--accent); }
    .status {
      color: var(--muted);
      font-size: 12px;
      width: 100%;
    }
    .status.err { color: #ff9b8a; }

    /* ---------- result panel ---------- */
    .result-panel {
      width: 100%;
      max-width: 580px;
      background: var(--bg-2);
      border: 1px solid var(--border-2);
      border-radius: 16px;
      padding: 14px 16px;
      color: var(--muted);
      font-size: 13px;
    }
    .result-panel pre {
      background: rgba(0,0,0,.35);
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 8px 0 0;
      direction: ltr;
    }

    /* ---------- picker styles (mirror production; kept here so the
                    module doesn't need any external CSS to work) ---------- */
    .bp-stage {
      position: relative;
      width: 100%;
      height: 55vh;
      min-height: 380px;
      margin: 12px 0 18px;
      overflow: hidden;
    }
    .bp-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .bp-count {
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      margin: 8px 0 0;
    }
    .bp-count span {
      color: var(--accent);
      font-weight: 800;
    }
    /* Visually-hidden a11y layer: real checkboxes for keyboard + screen
       readers, positioned off-screen but still focusable. */
    .bp-a11y {
      position: absolute;
      pointer-events: none;
    }
    .bp-a11y input, .bp-a11y label {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    /* Focus is visible via canvas focus ring; still keep native ring for
       accessibility trees that walk to the underlying input. */

    /* ---------- fallback grid (rendered by the test page when
                    "force fallback" is toggled) ---------- */
    .atmo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0 24px;
    }
    @media (max-width: 480px) {
      .atmo-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .atmo-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0d1822;
      border: 1.5px solid var(--border-2);
      border-radius: 13px;
      padding: 12px 13px;
      cursor: pointer;
      user-select: none;
      transition: border-color .2s, background .2s, transform .15s var(--ease);
    }
    .atmo-chip:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.25); }
    .atmo-chip:has(.atmo-checkbox:checked) {
      border-color: var(--accent);
      background: rgba(240,167,63,.09);
      box-shadow: 0 0 0 3px rgba(240,167,63,.08);
    }
    .atmo-checkbox {
      width: 18px; height: 18px; cursor: pointer;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }
    .atmo-name { font-size: 14px; color: var(--text); font-weight: 600; }

    /* ---------- submit button (matches production) ---------- */
    .btn {
      padding: 15px 28px;
      border: none;
      border-radius: 15px;
      font-family: inherit;
      font-weight: 800;
      font-size: 15.5px;
      cursor: pointer;
      transition: box-shadow .25s, transform .12s var(--ease), filter .2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #1b1508;
      box-shadow: 0 6px 22px rgba(240,167,63,.30);
    }
    .btn-primary:hover { box-shadow: 0 10px 28px rgba(240,167,63,.45); }
    .btn-primary:disabled { opacity: .6; cursor: default; }
    .btn-block { width: 100%; }

    .sb-spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(0,0,0,.25);
      border-top-color: #1b1508;
      border-radius: 50%;
      animation: sb-spin .7s linear infinite;
      vertical-align: middle;
    }
    @keyframes sb-spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div class="controls">
    <button id="loadHardcoded" type="button">17 hardcoded</button>
    <button id="loadSupabase" type="button">from /api/v5/databox-atmospheres</button>
    <label class="toggle"><input type="checkbox" id="usePrechecked"> prechecked (first 3)</label>
    <label class="toggle"><input type="checkbox" id="forceGrid"> force fallback grid</label>
    <span class="grow"></span>
    <button class="primary" id="mount" type="button">mount picker</button>
    <div class="status" id="status">Load a set, then click "mount picker".</div>
  </div>

  <div class="app">
    <div class="screen-card" id="card">
      <p class="subtitle">— empty — click "mount picker" above.</p>
    </div>
  </div>

  <div class="result-panel">
    <div>Last resolved selection:</div>
    <pre id="resultPre">(none yet)</pre>
  </div>

  <script type="module" src="/v6/test-atmosphere/test.js?v=1"></script>
</body>

</html>
