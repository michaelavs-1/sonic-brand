<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>נגן — טסט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
<style>
  :root {
    --bg: #0a1117;
    --bg-2: #0f1c26;
    --card: #142835;
    --border: rgba(255,255,255,.07);
    --border-2: rgba(255,255,255,.14);
    --text: #f5f7f8;
    --muted: #93a5af;
    --accent: #f0a73f;
    --accent-2: #d98a1f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    padding: 26px 16px 60px;
    background:
      radial-gradient(1000px 560px at 85% -12%, rgba(44,99,122,.38), transparent 62%),
      radial-gradient(760px 460px at 4% 108%, rgba(240,167,63,.10), transparent 55%),
      var(--bg);
    display: flex; flex-direction: column; align-items: center;
  }
  .app { width: 100%; max-width: 480px; }

  .screen-card {
    position: relative;
    background: linear-gradient(180deg, var(--card), var(--bg-2));
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 24px 20px 20px;
    box-shadow: 0 0 40px rgba(240,167,63,.10), 0 24px 60px rgba(0,0,0,.35);
  }
  h1 {
    font-size: 20px; font-weight: 900; margin: 0 0 14px;
    text-align: center; letter-spacing: .2px;
  }

  /* ========== Below: same sw2/swipe classes as v6/index.html ========== */
  .preview-card { animation: fadeIn .35s; }
  .swipe-card { display:block; position:relative; user-select:none; -webkit-user-select:none; }
  .swipe-card2 { display:block; padding:18px 14px 14px; text-align:center; }

  .sw2-artwrap { position:relative; width:min(56vw,230px); margin:6px auto 16px; }
  .sw2-art {
    position:relative; z-index:2;
    width:100%; aspect-ratio:1/1; object-fit:cover;
    border-radius:14px; display:block;
    box-shadow:0 12px 32px rgba(0,0,0,.5);
  }
  .sw2-art-ph {
    display:flex; align-items:center; justify-content:center;
    font-size:46px; background:#0a1117; border:1px solid var(--border-2);
  }
  .sw2-spbadge {
    position:absolute; z-index:3;
    left:-10px; top:-10px;
    width:40px; height:40px; border-radius:50%;
    background:#000; border:1px solid rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.5);
  }
  .sw2-play {
    position:absolute; z-index:3;
    right:-14px; bottom:-14px;
    width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg,#f0a73f,#d98a1f);
    color:#1b1508; border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 8px 22px rgba(0,0,0,.55);
  }
  .sw2-play:active { transform:scale(.94); }

  /* Hidden Spotify iframe — kept in-viewport with opacity:.01 so its media
     pipeline stays active, but visually covered by the album art. */
  .sw2-embed-hidden {
    position:absolute; inset:0;
    opacity:.01; pointer-events:none;
    overflow:hidden; border-radius:14px; z-index:1;
  }

  .sw2-title { font-size:24px; font-weight:800; color:var(--text); margin:0 0 2px; }
  .sw2-artist { font-size:15px; color:var(--muted); margin-bottom:9px; }
  .sw2-chip {
    display:inline-block; background:#0a1117;
    border:1px solid var(--border-2); color:#cfd8dd;
    font-size:12px; font-weight:700;
    border-radius:8px; padding:3px 11px; margin-bottom:11px;
  }
  .preview-reason.sw2-reason {
    text-align:center; max-width:36ch; margin:0 auto 12px;
    font-size:12px; color:var(--muted); line-height:1.6;
  }
  .sw2-hint {
    font-size:11.5px; color:var(--muted); opacity:.8; margin-top:8px;
  }
  .swap-btn {
    margin-top:7px;
    background:none;
    border:1px dashed var(--border-2);
    border-radius:10px;
    color:var(--muted);
    font-family:inherit; font-size:11.5px;
    padding:6px 11px; cursor:pointer;
    transition:all .2s;
  }
  .swap-btn:hover { border-color: var(--accent); color: var(--accent); }
  .swap-btn:disabled { opacity:.5; cursor:not-allowed; }

  /* ========== NEW: scrubbable progress bar ========== */
  .sw2-progress {
    direction: ltr;      /* time reads left→right regardless of doc dir */
    max-width: 300px;
    margin: 4px auto 14px;
  }
  /* Outer bar reserves fixed 14px of vertical space (extra hit area for
     touch/click). The visible track lives inside as an absolute element that
     grows on hover WITHOUT changing the outer layout height — nothing below
     shifts. Thumb also sits inside so it's centered on the same axis. */
  .sw2-prog-bar {
    position: relative;
    height: 14px;
    cursor: pointer;
    touch-action: none;
  }
  .sw2-prog-track {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 6px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 99px;
    overflow: hidden;
    transition: height .15s;
    pointer-events: none;
  }
  .sw2-prog-bar:hover .sw2-prog-track,
  .sw2-prog-bar.dragging .sw2-prog-track {
    height: 10px;
  }
  .sw2-prog-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 99px;
    pointer-events: none;
  }
  .sw2-prog-thumb {
    position: absolute;
    top: 50%; left: 0;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
  }
  .sw2-prog-bar:hover .sw2-prog-thumb,
  .sw2-prog-bar.dragging .sw2-prog-thumb { opacity: 1; }

  .sw2-timestamps {
    display: flex; justify-content: space-between;
    margin-top: 5px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

  .doc-hint {
    font-size: 11.5px; color: var(--muted);
    text-align: center; margin-top: 14px; line-height: 1.55;
  }
  .doc-hint code {
    background: #0d1822;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
    color: var(--accent);
  }
</style>
</head>
<body>
  <div class="app">
    <div class="screen-card">
      <h1>נגן — טסט</h1>

      <div class="preview-card swipe-card swipe-card2" id="card">
        <div class="sw2-artwrap" id="artwrap">
          <div class="sw2-art sw2-art-ph" id="art">🎵</div>
          <span class="sw2-spbadge" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="30" height="30">
              <circle cx="12" cy="12" r="11.5" fill="#000"/>
              <path d="M6.4 9.3c3.6-1.1 7.8-.6 10.9 1.2" stroke="#1DB954" stroke-width="1.7" fill="none" stroke-linecap="round"/>
              <path d="M7 12.2c3.1-.9 6.5-.4 9.2 1.1" stroke="#1DB954" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              <path d="M7.6 15c2.5-.7 5.2-.3 7.3 1" stroke="#1DB954" stroke-width="1.3" fill="none" stroke-linecap="round"/>
            </svg>
          </span>
          <button class="sw2-play" id="playBtn" type="button" aria-label="נגן">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8.2 5.6v12.8L19 12z"/></svg>
          </button>
          <div class="sw2-embed-hidden" id="embedHidden">
            <div id="mount"></div>
          </div>
        </div>

        <div class="sw2-title"  id="title"  dir="ltr">—</div>
        <div class="sw2-artist" id="artist" dir="ltr">טוען…</div>
        <div class="sw2-chip">Preview</div>
        <div class="preview-reason sw2-reason" id="reason">
          שיר לדוגמא — אווירה קלילה ואלגנטית שמתאימה לבר יין שכונתי.
        </div>

        <!-- NEW: Scrubbable progress bar -->
        <div class="sw2-progress">
          <div class="sw2-prog-bar" id="progBar">
            <div class="sw2-prog-track">
              <div class="sw2-prog-fill" id="progFill"></div>
            </div>
            <div class="sw2-prog-thumb" id="progThumb"></div>
          </div>
          <div class="sw2-timestamps">
            <span id="tCurrent">0:00</span>
            <span id="tTotal">0:00</span>
          </div>
        </div>

        <div>
          <button class="swap-btn" id="swapBtn" type="button">🔀 שיר אחר מהכיוון הזה</button>
        </div>
        <div class="sw2-hint">👆 גרור את הפס או לחץ במקום ספציפי כדי לדלג</div>
      </div>

      <p class="doc-hint">
        <code>?uri=spotify:track:XXXX</code> ב-URL — טוען שיר אחר.
      </p>
    </div>
  </div>

<script>
  // ---------- Config ----------
  const TRACKS = [
    { uri: 'spotify:track:0VjIjW4GlUZAMYd2vXMi3b', name: 'Blinding Lights',         artist: 'The Weeknd' },
    { uri: 'spotify:track:4uLU6hMCjMI75M1A2tKUQC', name: 'Never Gonna Give You Up', artist: 'Rick Astley' },
    { uri: 'spotify:track:32OlwWuMpZ6b0aN2RZOeMS', name: 'Uptown Funk',             artist: 'Mark Ronson, Bruno Mars' },
    { uri: 'spotify:track:7qiZfU4dY1lWllzX7mPBI3', name: 'Shape of You',            artist: 'Ed Sheeran' },
  ];
  const overrideUri = new URLSearchParams(location.search).get('uri');
  if (overrideUri) TRACKS.unshift({ uri: overrideUri, name: '(מ-URL)', artist: '' });
  let trackIndex = 0;

  // ---------- Playback state (mirror of last playback_update) ----------
  const state = {
    lastPosition:  0,     // ms
    lastTimestamp: 0,     // ms (Date.now())
    duration:      0,     // ms
    isPaused:      true,
    dragging:      false,
    pendingSeek:   null,  // seconds — set during drag; committed on release
  };
  let controller = null;

  const PLAY_ICON  = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8.2 5.6v12.8L19 12z"/></svg>';
  const PAUSE_ICON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="6.6" y="5.6" width="3.9" height="12.8" rx="1.2"/><rect x="13.5" y="5.6" width="3.9" height="12.8" rx="1.2"/></svg>';

  // ---------- Spotify IFrame API singleton ----------
  let apiPromise = null;
  function getApi() {
    if (apiPromise) return apiPromise;
    apiPromise = new Promise((resolve) => {
      if (window.__sbIframeApi) return resolve(window.__sbIframeApi);
      window.onSpotifyIframeApiReady = (IFrameAPI) => {
        window.__sbIframeApi = IFrameAPI;
        resolve(IFrameAPI);
      };
    });
    return apiPromise;
  }

  // ---------- Utils ----------
  function fmt(ms) {
    const s   = Math.floor(Math.max(0, ms) / 1000);
    const m   = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${String(sec).padStart(2, '0')}`;
  }
  function currentPositionMs() {
    if (state.dragging && state.pendingSeek != null) return state.pendingSeek * 1000;
    if (state.isPaused) return state.lastPosition;
    const elapsed = Date.now() - state.lastTimestamp;
    return Math.min(state.duration || Infinity, state.lastPosition + elapsed);
  }

  // ---------- DOM refs ----------
  const $ = (id) => document.getElementById(id);
  const titleEl    = $('title');
  const artistEl   = $('artist');
  const playBtn    = $('playBtn');
  const swapBtn    = $('swapBtn');
  const progBar    = $('progBar');
  const progFill   = $('progFill');
  const progThumb  = $('progThumb');
  const tCurrentEl = $('tCurrent');
  const tTotalEl   = $('tTotal');
  const mount      = $('mount');

  function renderTrackMeta(track) {
    titleEl.textContent  = track.name || '';
    artistEl.textContent = track.artist || '';
  }
  function renderProgress() {
    const pos = currentPositionMs();
    const dur = state.duration;
    const pct = dur > 0 ? Math.min(1, pos / dur) : 0;
    progFill.style.width = (pct * 100) + '%';
    progThumb.style.left = (pct * 100) + '%';
    tCurrentEl.textContent = fmt(pos);
    tTotalEl.textContent   = fmt(dur);
  }
  (function tick() { renderProgress(); requestAnimationFrame(tick); })();

  // ---------- Load / swap track ----------
  async function loadTrack(uri) {
    const api = await getApi();
    // Reset local state
    state.lastPosition  = 0;
    state.lastTimestamp = Date.now();
    state.duration      = 0;
    state.isPaused      = true;
    state.pendingSeek   = null;
    playBtn.innerHTML   = PLAY_ICON;

    if (controller) { try { controller.destroy(); } catch {} controller = null; }
    mount.innerHTML = '';
    const fresh = document.createElement('div');
    mount.appendChild(fresh);

    api.createController(fresh, { uri, width: '100%', height: 80 }, (c) => {
      controller = c;
      c.addListener('playback_update', (e) => {
        const d = e?.data || {};
        if (typeof d.duration === 'number' && d.duration > 0) state.duration = d.duration;
        if (typeof d.position === 'number') {
          state.lastPosition  = d.position;
          state.lastTimestamp = Date.now();
        }
        state.isPaused = d.isPaused !== false;
        playBtn.innerHTML = state.isPaused ? PLAY_ICON : PAUSE_ICON;
      });
    });
  }

  // ---------- Play / pause ----------
  playBtn.addEventListener('click', () => {
    if (!controller) return;
    try { controller.togglePlay(); } catch {}
  });

  // ---------- Swap ----------
  swapBtn.addEventListener('click', () => {
    trackIndex = (trackIndex + 1) % TRACKS.length;
    const t = TRACKS[trackIndex];
    renderTrackMeta(t);
    loadTrack(t.uri);
  });

  // ---------- Progress bar: click + drag to seek ----------
  function pctFromEvent(e) {
    const rect = progBar.getBoundingClientRect();
    const x    = Math.max(rect.left, Math.min(rect.right, e.clientX));
    return (x - rect.left) / rect.width;
  }
  function seekTo(seconds) {
    if (!controller) return;
    try { controller.seek(seconds); } catch {}
    // Snap the local mirror so the RAF loop doesn't briefly interpolate from
    // the old position before the next playback_update arrives.
    state.lastPosition  = seconds * 1000;
    state.lastTimestamp = Date.now();
  }

  progBar.addEventListener('pointerdown', (e) => {
    if (!state.duration) return;
    state.dragging    = true;
    state.pendingSeek = pctFromEvent(e) * (state.duration / 1000);
    progBar.classList.add('dragging');
    try { progBar.setPointerCapture(e.pointerId); } catch {}
    e.preventDefault();
  });
  progBar.addEventListener('pointermove', (e) => {
    if (!state.dragging) return;
    state.pendingSeek = pctFromEvent(e) * (state.duration / 1000);
  });
  const endDrag = () => {
    if (!state.dragging) return;
    const target      = state.pendingSeek;
    state.dragging    = false;
    state.pendingSeek = null;
    progBar.classList.remove('dragging');
    if (target != null) seekTo(target);
  };
  progBar.addEventListener('pointerup',     endDrag);
  progBar.addEventListener('pointercancel', endDrag);

  // ---------- Boot ----------
  const first = TRACKS[0];
  renderTrackMeta(first);
  loadTrack(first.uri);
</script>
</body>
</html>
